name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "photo_scroller_v2.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build PhotoScrollerV2.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name PhotoScrollerV2 `
            --collect-all tkinterdnd2 `
            photo_scroller_v2.py

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/PhotoScrollerV2.exe")) {
            throw "Nie znaleziono dist/PhotoScrollerV2.exe"
          }
          Get-Item "dist/PhotoScrollerV2.exe" | Format-List Name,Length,FullName

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: PhotoScrollerV2-Windows
          path: dist/PhotoScrollerV2.exe
          if-no-files-found: error
          retention-days: 30
