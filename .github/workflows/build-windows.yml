name: Build PhotoScrollerV3 for Windows

"on":
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build PhotoScrollerV3
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name PhotoScrollerV3 photo_scroller_v3.py

      - name: Upload PhotoScrollerV3
        uses: actions/upload-artifact@v4
        with:
          name: PhotoScrollerV3-Windows
          path: dist/PhotoScrollerV3.exe
          if-no-files-found: error
